<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#dbeafe;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:350px;
            background:white;
            border-radius:15px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.3);
            text-align:center;
            padding:20px;
        }

        img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:4px solid royalblue;
            margin-bottom:15px;
        }

        h1{
            color:royalblue;
            margin-bottom:10px;
        }

        h3{
            color:#555;
            margin-bottom:15px;
        }

        p{
            margin:8px 0;
            color:#333;
        }

        button{
            margin-top:20px;
            background:royalblue;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:navy;
        }

    </style>

</head>
<body>

<div class="card">

    <img src="my photo.jpeg" alt="Profile">

    <h1>Dikshya Khanal</h1>

    <h3>Computer Engineering Student</h3>

    <p><strong>College:</strong> Everest Engineering College</p>

    <p><strong>Semester:</strong> 6th</p>

    <p><strong>Learning:</strong> MERN Stack Development</p>

    <button>View Profile</button>

</div>

</body>
</html>
