<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notification Card</title>

    <style>

        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 300px;
            background-color: white;
            padding: 30px;
            margin: 100px auto;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;

            position: relative;
        }

        .notification {
            position: absolute;
            top: 10px;
            right: 10px;

            background-color: red;
            color: white;

            padding: 5px 10px;
            border-radius: 50%;
        }

        .card h2 {
            color: darkblue;
        }

        button {
            background-color: darkblue;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
        }

    </style>
</head>

<body>

    <div class="card">

        <div class="notification">
            3
        </div>

        <h2>My Messages</h2>

        <p>You have some new messages.</p>

        <button>Open Messages</button>

    </div>

</body>
</html>
