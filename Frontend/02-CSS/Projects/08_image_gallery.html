<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Gallery</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            margin: 30px;
            color: darkblue;
        }

        .gallery {
            width: 90%;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/400/300?1" alt="Photo 1">

        <img src="https://picsum.photos/400/300?2" alt="Photo 2">

        <img src="https://picsum.photos/400/300?3" alt="Photo 3">

        <img src="https://picsum.photos/400/300?4" alt="Photo 4">

        <img src="https://picsum.photos/400/300?5" alt="Photo 5">

        <img src="https://picsum.photos/400/300?6" alt="Photo 6">

    </div>

</body>
</html>
