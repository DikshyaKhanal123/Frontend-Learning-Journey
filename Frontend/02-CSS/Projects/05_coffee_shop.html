<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean Bliss Coffee</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        header{
            background:#5d4037;
            color:white;
            padding:20px;
        }

        header h1{
            display:inline-block;
        }

        nav{
            float:right;
            margin-top:8px;
        }

        nav a{
            text-decoration:none;
            color:white;
            margin-left:20px;
            font-weight:bold;
        }

        nav a:hover{
            color:gold;
        }

        .hero{
            text-align:center;
            padding:80px 20px;
            background:#d7ccc8;
        }

        .hero h2{
            font-size:40px;
            color:#4e342e;
        }

        .hero p{
            margin:20px 0;
            font-size:18px;
        }

        button{
            background:#5d4037;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#3e2723;
        }

        .menu{
            text-align:center;
            padding:40px;
        }

        .card{
            display:inline-block;
            width:250px;
            background:white;
            margin:15px;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        .card h3{
            color:#6d4c41;
            margin-bottom:10px;
        }

        footer{
            background:#5d4037;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }

    </style>

</head>
<body>

<header>

    <h1>☕ Bean Bliss</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

</header>

<section class="hero">

    <h2>Fresh Coffee Every Day</h2>

    <p>Enjoy freshly brewed coffee made with love.</p>

    <button>Order Now</button>

</section>

<section class="menu">

    <h2>Our Special Menu</h2>

    <br><br>

    <div class="card">
        <h3>Espresso</h3>
        <p>Strong and rich coffee.</p>
        <p><strong>Rs. 180</strong></p>
    </div>

    <div class="card">
        <h3>Cappuccino</h3>
        <p>Creamy and delicious.</p>
        <p><strong>Rs. 250</strong></p>
    </div>

    <div class="card">
        <h3>Latte</h3>
        <p>Smooth milk coffee.</p>
        <p><strong>Rs. 280</strong></p>
    </div>

</section>

<footer>

    <p>© 2026 Bean Bliss Coffee. All Rights Reserved.</p>

</footer>

</body>
</html>
