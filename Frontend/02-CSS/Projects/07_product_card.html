<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Card</title>

    <style>

        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 100px;
        }

        .card {
            width: 300px;
            background-color: white;
            padding: 20px;
            text-align: center;
            border: 1px solid gray;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .card img {
            width: 200px;
            height: 200px;
        }

        .card h2 {
            color: darkblue;
        }

        .card p {
            color: gray;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background-color: darkblue;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
        }

        button:hover {
            background-color: blue;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <img src="https://via.placeholder.com/200" alt="Product">

            <h2>Wireless Headphones</h2>

            <p>
                High quality wireless headphones
                with comfortable design.
            </p>

            <p class="price">Rs. 2500</p>

            <button>Buy Now</button>

        </div>

    </div>

</body>
</html>
