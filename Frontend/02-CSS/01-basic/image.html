<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>

    <style>

        body{
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .card{
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            border: 3px solid #333;
            border-radius: 10px;
            background-color: white;
            text-align: center;
            box-sizing: border-box;
        }

        h1{
            color: darkblue;
            font-size: 30px;
        }

        p{
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        img{
            width: 150px;
            border-radius: 50%;
            border: 4px solid royalblue;
        }

        button{
            background-color: royalblue;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkblue;
        }

    </style>

</head>
<body>

    <div class="card">

        <img src="C:/Users/Asus/OneDrive/Desktop/My documents/my photo.jpeg" alt="Profile Picture">

        <h1>Dikshya Khanal</h1>

        <p>
            Computer Engineering Student <br>
            Learning MERN Stack Development 🚀
        </p>

        <button>Contact Me</button>

    </div>

</body>
</html>
